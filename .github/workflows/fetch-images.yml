name: Fetch images

# Downloads a list of image URLs into public/images and commits them.
# Run manually: Actions > Fetch images > Run workflow, paste a JSON list like
# [{"name":"hero-bg.jpg","url":"https://..."}]

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: 'JSON array of {"name","url"} objects'
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download images
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          mkdir -p public/images
          echo "$MANIFEST" > /tmp/manifest.json
          count=$(jq length /tmp/manifest.json)
          for i in $(seq 0 $((count - 1))); do
            name=$(jq -r ".[$i].name" /tmp/manifest.json)
            url=$(jq -r ".[$i].url" /tmp/manifest.json)
            echo "::add-mask::$url"
            case "$name" in
              */*|..*) echo "Skipping unsafe name $name"; continue ;;
            esac
            if curl -fsSL --retry 3 -o "public/images/$name" "$url"; then
              echo "Saved $name ($(stat -c%s "public/images/$name") bytes)"
            else
              echo "::warning::Failed to download $name"
            fi
          done

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "Add project photos from Figma"
            git push
          fi
